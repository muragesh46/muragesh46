<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradientMove {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        @keyframes pulseGlow {
          0%, 100% { opacity: 0.6; transform: scale(1); }
          50% { opacity: 0.9; transform: scale(1.05); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-6px); }
        }
        .banner-container {
          width: 100%;
          height: 240px;
          border-radius: 16px;
          background: linear-gradient(-45deg, #0a0e1a, #0f172a, #1e1b4b, #0f2b48);
          background-size: 300% 300%;
          animation: gradientMove 10s ease infinite;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-circle {
          position: absolute;
          width: 300px;
          height: 300px;
          border-radius: 50%;
          filter: blur(80px);
          pointer-events: none;
        }
        .glow-1 {
          background: #3b82f6;
          top: -80px;
          left: -40px;
          animation: pulseGlow 6s infinite alternate;
        }
        .glow-2 {
          background: #8b5cf6;
          bottom: -80px;
          right: -40px;
          animation: pulseGlow 7s infinite alternate 1s;
        }
        .glow-3 {
          background: #06b6d4;
          top: 40px;
          right: 30%;
          width: 200px;
          height: 200px;
          animation: pulseGlow 5s infinite alternate 2s;
        }
        .title {
          font-size: 42px;
          font-weight: 800;
          margin: 0;
          background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          letter-spacing: -0.5px;
          z-index: 2;
          text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .subtitle {
          font-size: 16px;
          font-weight: 500;
          color: #94a3b8;
          margin-top: 8px;
          margin-bottom: 18px;
          z-index: 2;
          letter-spacing: 0.5px;
        }
        .badges-container {
          display: flex;
          gap: 10px;
          z-index: 2;
        }
        .pill {
          padding: 6px 14px;
          border-radius: 20px;
          font-size: 13px;
          font-weight: 600;
          color: #f8fafc;
          background: rgba(255, 255, 255, 0.08);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.15);
          display: flex;
          align-items: center;
          gap: 6px;
          animation: float 4s ease-in-out infinite;
        }
        .pill:nth-child(2) {
          animation-delay: 1s;
          border-color: rgba(56, 189, 248, 0.3);
          background: rgba(56, 189, 248, 0.1);
        }
        .pill:nth-child(3) {
          animation-delay: 2s;
          border-color: rgba(192, 132, 252, 0.3);
          background: rgba(192, 132, 252, 0.1);
        }
      </style>
      <div class="banner-container">
        <div class="glow-circle glow-1"></div>
        <div class="glow-circle glow-2"></div>
        <div class="glow-circle glow-3"></div>
        
        <h1 class="title">Hi, I'm Muragesh Mirje 👋</h1>
        <div class="subtitle">Full Stack &amp; AI/ML Engineer • Scalable Systems &amp; Intelligent Workflows</div>
        
        <div class="badges-container">
          <div class="pill">⚛️ Full Stack Developer</div>
          <div class="pill">🤖 AI &amp; Machine Learning</div>
          <div class="pill">⚡ n8n &amp; Automation</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
